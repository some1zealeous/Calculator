<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<!-- using bootstrap utilities for structuring this html doc -->

<body class="d-flex flex-column min-vh-100">
    <!-- structuring the topmost panel ( navigation bar) -->
    <header>
        <nav class="navbar navbar-expand-lg sticky-top">    
            <div class="container-x1">
                <div class="navbar-brand d-flex align-items-center">
                    <span class="brand-text fs-3 fw-semibold">Calculator</span>
                </div>
                <div class="navbar-nav d-flex flex-row gap-4">
                    <a href="#interface" class="nav-link px-3 py-2 rounded-2">Interface</a>
                    <a href="#about" class="nav-link px-3 py-2 rounded-2">About</a>
                </div>
            </div>
        </nav>
    </header>
    
    <!-- structuring the main area ( main body ) -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-8 col-md-6 col-lg-4 col-xl-3">
                    <div class="calculator-container rounded-4 overflow-hidden border">
                        <div>
                            <div class="display-section p-4 text-end border-bottom">
                                <div class="display-expression mb-2 opacity-75" id="expression"></div>
                                <div class="display-main d-flex align-items-center justify-content-end" id="display">0</div>
                            </div>

                            <!-- buttons arrangement -->
                            <div class="button-grid p-2 d-flex flex-wrap gap-1">
                                <!-- <row-1> -->
                                <button class="calc-button function-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleOperator('%')">%</button>
                                <button class="calc-button function-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleFunction('1/x')">¹⁄ₓ</button>
                                <button class="calc-button clear-btn flex-fill rounded-3 border-0 fw-medium" onclick="clearAll()">C</button>
                                <button class="calc-button delete-btn flex-fill rounded-3 border-0 fw-medium" onclick="backspace()">⌫</button>
                            
                                <!-- <row-2> -->
                                <button class="calc-button operator-btn flex-fill rounded-3 border-0 fw-medium" onclick="handleInput('(')">(</button>
                                <button class="calc-button operator-btn flex-fill rounded-3 border-0 fw-medium" onclick="handleInput(')')">)</button>
                                <button class="calc-button operator-btn flex-fill rounded-3 border-0 fw-noraml" onclick="handleFunction('x²')">x<sup>2</sup></button>
                                <button class="calc-button operator-btn flex-fill rounded-3 border-0 fw-medium" onclick="handleOperator('/')">&divide</button>

                                <!-- <row-3> -->
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('7')">7</button>
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('8')">8</button>
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('9')">9</button>
                                <button class="calc-button operator-btn flex-fill rounded-3 border-0 fw-medium" onclick="handleOperator('*')">&times;</button>

                                <!-- <row-4> -->
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('4')">4</button>
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('5')">5</button>
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('6')">6</button>
                                <button class="calc-button operator-btn flex-fill rounded-3 border-0 fw-medium" onclick="handleOperator('-')">&minus;</button>

                                <!-- <row-5> -->
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('1')">1</button>
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('2')">2</button>
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('3')">3</button>
                                <button class="calc-button operator-btn flex-fill rounded-3 border-0 fw-medium" onclick="handleOperator('+')">+</button>

                                <!-- <row-6> -->
                                <button class="calc-button function-btn flex-fill rounded-3 border-0 fw-medium" onclick="toggleSign()">⁺⁄₋</button>
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('0')">0</button>
                                <button class="calc-button number-btn flex-fill rounded-3 border-0 fw-normal" onclick="handleInput('.')">.</button>
                                <button class="calc-button equals-btn flex-fill rounded-3 border-0 fw-normal" onclick="calculate()">=</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- structuring the bottom panel ( Footer ) -->
    <footer class="footer mt-auto border-top">
        <div class="container-x1">
            <div class="row">
                <div class="col-12">
                    <div class="text-center py-4">
                        <p class="copyright mb-0 small fw-light lh-base">
                            © 2024 Matte Calculator. All rights reserved. 
                            <span class="separator mx-2"></span>
                            Designed with precision and style
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </footer>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="test.js"></script>

</body>

</html>
